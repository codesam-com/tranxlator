name: 00_manual_start

on:
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select URL from queue
        run: |
          python scripts/start_run.py --queue inputs/video_urls.txt --output run_context.json
      - name: Upload run context
        uses: actions/upload-artifact@v4
        with:
          name: run-context
          path: run_context.json
