name: 00_manual_start

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select URL from queue
        run: |
          python scripts/start_run.py --queue inputs/video_urls.txt --output run_context.json

      - name: Persist stage
        run: |
          python scripts/persist_stage.py \
            --context run_context.json \
            --stage 00_manual_start \
            --run-id ${{ github.run_id }} \
            --attempt ${{ github.run_attempt }} \
            --inputs run_context.json

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add audit
          git commit -m "run ${{ github.run_id }} stage 00_manual_start" || echo "no changes"
          git push
