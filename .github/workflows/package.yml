name: package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - run: cat works/active_run.json > run_context.json

      - name: Stage check
        id: check
        run: |
          python scripts/stage_control.py --context run_context.json --stage package --mode check > out.txt
          echo "result=$(cat out.txt)" >> $GITHUB_OUTPUT

      - name: Run package
        if: steps.check.outputs.result == 'RUN'
        run: python scripts/package_results.py

      - name: Upload artifact
        if: steps.check.outputs.result == 'RUN'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ github.run_id }}
          path: "*.zip"
          retention-days: 7

      - name: Persist metadata
        if: steps.check.outputs.result == 'RUN'
        run: python scripts/persist_stage.py --context run_context.json --stage package --inputs package_artifact.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add works
          git commit -m "package metadata" || echo "no changes"
          git push
