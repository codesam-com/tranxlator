name: translate

on:
  workflow_run:
    workflows: ["diarize"]
    types:
      - completed

permissions:
  contents: write

jobs:
  translate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install transformers sentencepiece torch

      - run: cat works/active_run.json > run_context.json

      - name: Stage check
        id: check
        run: |
          python scripts/stage_control.py --context run_context.json --stage translate --mode check > out.txt
          echo "result=$(cat out.txt)" >> $GITHUB_OUTPUT

      - name: Recover inputs
        if: steps.check.outputs.result == 'RUN'
        run: |
          WORK=$(jq -r '.work_id' run_context.json)
          cp works/$WORK/diarize/transcript_speakers.json transcript_speakers.json
          cp works/$WORK/transcribe/metrics_transcribe.json metrics_transcribe.json

      - name: Run translate
        if: steps.check.outputs.result == 'RUN'
        run: |
          LANG=$(jq -r '.language' metrics_transcribe.json)
          if [ "$LANG" = "en" ]; then
            python scripts/translate_en_es.py
          else
            python scripts/translate.py
          fi

      - name: Persist translate
        if: steps.check.outputs.result == 'RUN'
        run: python scripts/persist_stage.py --context run_context.json --stage translate --inputs translated_segments.json translated_es.srt speaker_srts_es_manifest.json speaker_srts_es

      - name: Commit translate
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add works
          git commit -m "translate" || echo "no changes"
          git push

  summarize:
    needs: translate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Load context
        run: |
          git pull --rebase
          cat works/active_run.json > run_context.json

      - name: Stage check
        id: check
        run: |
          python scripts/stage_control.py --context run_context.json --stage summarize --mode check > out.txt
          echo "result=$(cat out.txt)" >> $GITHUB_OUTPUT

      - name: Recover inputs
        if: steps.check.outputs.result == 'RUN'
        run: |
          WORK=$(jq -r '.work_id' run_context.json)
          cp works/$WORK/translate/translated_segments.json translated_segments.json

      - name: Run summarize
        if: steps.check.outputs.result == 'RUN'
        run: python scripts/summarize.py

      - name: Persist summarize
        if: steps.check.outputs.result == 'RUN'
        run: python scripts/persist_stage.py --context run_context.json --stage summarize --inputs summary_es.md tags.json

      - name: Commit summarize
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add works
          git commit -m "summarize" || echo "no changes"
          git push
