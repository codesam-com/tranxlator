name: 10_transcribe

on:
  workflow_run:
    workflows: ["00_manual_start"]
    types:
      - completed

permissions:
  contents: write

jobs:
  transcribe:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq file

      - name: Install python deps
        run: |
          pip install --upgrade pip
          pip install faster-whisper whisperx yt-dlp gdown

      - name: Load active context
        run: |
          cat audit/active_run.json > run_context.json

      - name: Download audio
        run: |
          python scripts/download_audio.py --context run_context.json

      - name: Normalize audio
        run: |
          INPUT=$(ls source_audio* | head -n 1)
          ffmpeg -y -i "$INPUT" -ac 1 -ar 16000 audio.wav

      - name: Transcribe
        run: |
          python scripts/transcribe.py

      - name: Persist stage
        run: |
          python scripts/persist_stage.py \
            --context run_context.json \
            --stage 10_transcribe \
            --run-id ${{ github.run_id }} \
            --attempt ${{ github.run_attempt }} \
            --inputs audio.wav transcript_raw.json

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add audit
          git commit -m "run ${{ github.run_id }} stage 10_transcribe" || echo "no changes"
          git push
