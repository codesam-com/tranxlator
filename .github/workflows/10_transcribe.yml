name: 10_transcribe

on:
  workflow_run:
    workflows: ["00_manual_start"]
    types:
      - completed

jobs:
  transcribe:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Install python deps
        run: |
          pip install --upgrade pip
          pip install faster-whisper whisperx yt-dlp

      - name: Download artifact from previous workflow
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const { owner, repo } = context.repo;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id });
            const artifact = artifacts.data.artifacts.find(a => a.name === "run-context");
            if (!artifact) {
              core.setFailed("run-context artifact not found");
              return;
            }
            const download = await github.rest.actions.downloadArtifact({ owner, repo, artifact_id: artifact.id, archive_format: 'zip' });
            const fs = require('fs');
            fs.writeFileSync('run-context.zip', Buffer.from(download.data));

      - name: Unzip artifact
        run: unzip run-context.zip -d run-context

      - name: Download audio
        run: |
          URL=$(jq -r '.resolved_url' run-context/run_context.json)
          echo "URL: $URL"
          yt-dlp -x --audio-format wav -o audio.%(ext)s "$URL" || echo "yt-dlp failed"

      - name: Fallback gdrive download
        run: |
          URL=$(jq -r '.resolved_url' run-context/run_context.json)
          if [ ! -f audio.wav ]; then
            wget -O audio.wav "$URL"
          fi

      - name: Run WhisperX
        run: |
          python - << 'EOF'
import whisperx
import json

model = whisperx.load_model("large-v3", device="cpu")
result = model.transcribe("audio.wav")

with open("transcript_raw.json", "w") as f:
    json.dump(result, f, indent=2)

print("done")
EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transcript-stage
          path: |
            transcript_raw.json
            audio.wav
