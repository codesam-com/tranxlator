name: 10_transcribe

on:
  workflow_run:
    workflows: ["00_manual_start"]
    types:
      - completed

jobs:
  transcribe:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq file

      - name: Install python deps
        run: |
          pip install --upgrade pip
          pip install faster-whisper whisperx yt-dlp gdown

      - name: Download artifact from previous workflow
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const { owner, repo } = context.repo;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id });
            const artifact = artifacts.data.artifacts.find(a => a.name === "run-context");
            if (!artifact) {
              core.setFailed("run-context artifact not found");
              return;
            }
            const download = await github.rest.actions.downloadArtifact({ owner, repo, artifact_id: artifact.id, archive_format: 'zip' });
            const fs = require('fs');
            fs.writeFileSync('run-context.zip', Buffer.from(download.data));

      - name: Unzip artifact
        run: unzip run-context.zip -d run-context

      - name: Download audio
        shell: bash
        run: |
          set -euo pipefail
          URL=$(jq -r '.resolved_url' run-context/run_context.json)
          SOURCE_TYPE=$(jq -r '.source_type' run-context/run_context.json)
          echo "URL: $URL"
          echo "SOURCE_TYPE: $SOURCE_TYPE"

          if [ "$SOURCE_TYPE" = "gdrive" ]; then
            gdown "$URL" -O source_audio || gdown --fuzzy "$URL" -O source_audio
          else
            yt-dlp -x --audio-format wav -o source_audio.%(ext)s "$URL"
          fi

      - name: Inspect downloaded payload
        shell: bash
        run: |
          set -euo pipefail
          ls -lah
          file source_audio* || true

      - name: Normalize audio to mono 16k WAV
        shell: bash
        run: |
          set -euo pipefail
          INPUT=$(ls source_audio* | head -n 1)
          ffmpeg -y -i "$INPUT" -ac 1 -ar 16000 audio.wav
          file audio.wav
          ffmpeg -i audio.wav -hide_banner

      - name: Run WhisperX
        run: |
          python - << 'EOF'
          import json
          import whisperx
          
          print('Loading WhisperX model large-v3 on CPU (int8)...')
          model = whisperx.load_model('large-v3', device='cpu', compute_type='int8')
          result = model.transcribe('audio.wav')
          
          with open('transcript_raw.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, indent=2, ensure_ascii=False)
          
          print('Detected language:', result.get('language'))
          print('Segments:', len(result.get('segments', [])))
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transcript-stage
          path: |
            transcript_raw.json
            audio.wav
            run-context/run_context.json
