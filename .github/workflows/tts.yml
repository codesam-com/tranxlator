name: tts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          pip install pydub git+https://github.com/myshell-ai/MeloTTS.git

      - run: cat works/active_run.json > run_context.json

      - name: Stage check
        id: check
        run: |
          python scripts/stage_control.py --context run_context.json --stage tts --mode check > out.txt
          echo "result=$(cat out.txt)" >> $GITHUB_OUTPUT

      - name: Recover inputs
        if: steps.check.outputs.result == 'RUN'
        run: |
          WORK=$(jq -r '.work_id' run_context.json)
          cp works/$WORK/translate/translated_segments.json translated_segments.json

      - name: Synthesize generic Spanish audio
        if: steps.check.outputs.result == 'RUN'
        run: python scripts/synthesize_tts_generic.py

      - name: Persist
        if: steps.check.outputs.result == 'RUN'
        run: python scripts/persist_stage.py --context run_context.json --stage tts --inputs tts_outputs

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add works
          git commit -m "tts synth" || echo "no changes"
          git push
